      ‘পাগল’, ‘ছবির অঙ্গ’ আর ছোটোনাগপুর ভ্রমণের স্মৃতি। ঋতু, প্রকৃতি, বই আর মানুষের
      স্বভাব নিয়ে হালকা চালের অথচ গভীর ভাবনা।
    description_en: >-
      Twenty-two prose pieces by Tagore — "Library", "Nababarsha", "Kekadhwani",
      "Pagal", "Chhabir Anga" and notes from a journey to Chhotanagpur. Light yet
      searching reflections on seasons, nature, books and human nature.

