authors:
  - slug: rabindranath-tagore
    name_bn: রবীন্দ্রনাথ ঠাকুর
    name_en: Rabindranath Tagore
    born: 1861
    died: 1941
    wikidata: Q7241
    wikisource: লেখক:রবীন্দ্রনাথ ঠাকুর
    bio_bn: >-
      কবি, গীতিকার, কথাসাহিত্যিক, নাট্যকার, চিত্রশিল্পী ও শিক্ষাবিদ। কলকাতার
      জোড়াসাঁকোর ঠাকুরবাড়িতে জন্ম। ‘গীতাঞ্জলি’র কবিতার ইংরেজি অনুবাদের জন্য
      ১৯১৩ সালে সাহিত্যে নোবেল পুরস্কার পান — প্রথম অ-ইউরোপীয় হিসেবে। দুই
      হাজারেরও বেশি গানের স্রষ্টা; বাংলাদেশ ও ভারতের জাতীয় সংগীত তাঁরই লেখা।
      শান্তিনিকেতনে বিশ্বভারতী প্রতিষ্ঠা করেন। আধুনিক বাংলা ছোটগল্পের রূপ তৈরি
      হয়েছে তাঁর হাতেই।
    bio_en: >-
      Poet, songwriter, novelist, playwright, painter and educator, born into the
      Tagore family of Jorasanko, Calcutta. In 1913 he became the first non-European
      to win the Nobel Prize in Literature, for his English renderings of poems from
      Gitanjali. He wrote more than two thousand songs, including the national
      anthems of Bangladesh and India, founded Visva-Bharati at Santiniketan, and
      shaped the modern Bengali short story.

  - slug: sarat-chandra-chattopadhyay
    name_bn: শরৎচন্দ্র চট্টোপাধ্যায়
    name_en: Sarat Chandra Chattopadhyay
    born: 1876
    died: 1938
    wikidata: Q404622
    wikisource: লেখক:শরৎচন্দ্র চট্টোপাধ্যায়
    bio_bn: >-
      হুগলি জেলার দেবানন্দপুরে জন্ম। জীবনের অনেকগুলো বছর কেটেছে বর্মার রেঙ্গুনে,
      সরকারি দপ্তরে চাকরি করে। গ্রামবাংলার মানুষ, বিশেষ করে নারীর জীবন আর সমাজের
      অন্যায় নিয়ে লেখা তাঁর উপন্যাস বাংলা সাহিত্যের সবচেয়ে জনপ্রিয় রচনাগুলোর মধ্যে।
      তাঁর বহু উপন্যাস নিয়ে চলচ্চিত্র হয়েছে; পাঠকের কাছে তিনি ‘অপরাজেয়
      কথাশিল্পী’।
    bio_en: >-
      Born in Debanandapur in Hooghly district, he spent many years in Rangoon,
      Burma, working in a government office. His novels of rural Bengal — above all
      of women's lives and the injustices of society — are among the most loved in
      Bengali, and many have been filmed. Readers know him as the "unconquerable
      storyteller".

  - slug: bankim-chandra-chattopadhyay
    name_bn: বঙ্কিমচন্দ্র চট্টোপাধ্যায়
    name_en: Bankim Chandra Chattopadhyay
    born: 1838
    died: 1894
    wikidata: Q377881
    wikisource: লেখক:বঙ্কিমচন্দ্র চট্টোপাধ্যায়
    bio_bn: >-
      নৈহাটির কাঁঠালপাড়ায় জন্ম। কলকাতা বিশ্ববিদ্যালয়ের প্রথম দুই স্নাতকের একজন;
      পেশায় ছিলেন ব্রিটিশ সরকারের ডেপুটি ম্যাজিস্ট্রেট। ‘দুর্গেশনন্দিনী’ (১৮৬৫)
      থেকে শুরু করে তাঁর উপন্যাসগুলোকে আধুনিক বাংলা উপন্যাসের ভিত্তি ধরা হয়।
      সাময়িকপত্র ‘বঙ্গদর্শন’ সম্পাদনা করেন। ‘আনন্দমঠ’-এর গান ‘বন্দে মাতরম্’ পরে
      ভারতের জাতীয় গীত হয়।
    bio_en: >-
      Born in Kanthalpara near Naihati, he was one of the first two graduates of the
      University of Calcutta and served as a deputy magistrate under British rule.
      His novels, beginning with Durgeshnandini (1865), are regarded as the
      foundation of the modern Bengali novel. He edited the journal Bangadarshan,
      and the song "Bande Mataram" from Anandamath became India's national song.

  - slug: upendrakishore-ray-chowdhury
    name_bn: উপেন্দ্রকিশোর রায়চৌধুরী
    name_en: Upendrakishore Ray Chowdhury
    born: 1863
    died: 1915
    wikidata: Q737942
    wikisource: লেখক:উপেন্দ্রকিশোর রায়চৌধুরী
    bio_bn: >-
      ময়মনসিংহের মসুয়া গ্রামে (বর্তমান বাংলাদেশ) জন্ম। শিশুসাহিত্যিক, চিত্রশিল্পী,
      সংগীতজ্ঞ ও মুদ্রণ-প্রযুক্তির উদ্ভাবক — হাফটোন ব্লক ছাপা নিয়ে তাঁর গবেষণা
      বিদেশেও স্বীকৃতি পায়। ছোটদের পত্রিকা ‘সন্দেশ’ (১৯১৩) তাঁরই প্রতিষ্ঠা করা।
      ‘টুনটুনির বই’, ‘ছেলেদের রামায়ণ’ ও ‘গুপী গাইন বাঘা বাইন’ তাঁর লেখা; সুকুমার
      রায় তাঁর ছেলে।
    bio_en: >-
      Born in the village of Masua in Mymensingh (now Bangladesh), he was a writer
      for children, illustrator, musician and printing innovator whose halftone
      research won recognition abroad. He founded the children's magazine Sandesh
      (1913) and wrote Tuntunir Boi, Chheleder Ramayan and Goopy Gyne Bagha Byne.
      Sukumar Ray was his son.

works:
  - slug: shesher-kobita
    title_bn: শেষের কবিতা
    title_en: Shesher Kobita
    title_latn: shesher kobita shesher kabita the last poem farewell song
    author: rabindranath-tagore
    form: novel
    genres: [upanyas]
    collections: [classics, rabindranath]
    first_published: 1929
    featured_rank: 1
    source: { root: "শেষের কবিতা (রবীন্দ্রনাথ ঠাকুর, ১৯২৯)" }
    description_bn: >-
      অক্সফোর্ড-ফেরত ব্যারিস্টার, তুখোড় কথাবাজ অমিত রায়ের সঙ্গে শিলং পাহাড়ে
      লাবণ্যর পরিচয় হয় এক মোটর দুর্ঘটনায়। কবিতা, তর্ক আর কৌতুকে ভরা এই প্রেমের
      উপন্যাস শেষ হয় বাংলা সাহিত্যের সবচেয়ে বিখ্যাত বিদায়ী কবিতাগুলোর একটিতে।
    description_en: >-
      In the hills of Shillong, Amit Ray — Oxford-returned barrister and dazzling
      talker — meets Labanya after a motor accident. A love story full of poetry,
      argument and wit, it ends in one of the most famous farewell poems in Bengali.

  - slug: devdas
    title_bn: দেবদাস
    title_en: Devdas
    title_latn: devdas debdas debdash
    author: sarat-chandra-chattopadhyay
    form: novel
    genres: [upanyas]
    collections: [classics, saratchandra]
    first_published: 1917
    featured_rank: 2
    source: { root: "দেবদাস (শরৎচন্দ্র চট্টোপাধ্যায়)" }
    description_bn: >-
      তালসোনাপুর গ্রামের জমিদারপুত্র দেবদাস আর প্রতিবেশী পরিবারের মেয়ে পার্বতী
      ছেলেবেলার সাথী। পারিবারিক অহংকার আর নিজের দ্বিধায় দেবদাস যে ভালোবাসা হারায়,
      তারই বেদনা তাকে টেনে নিয়ে যায় কলকাতার পথে, চন্দ্রমুখীর কাছে, আর ক্রমশ
      ধ্বংসের দিকে। বাংলা সাহিত্যের সবচেয়ে বেশি পঠিত ও চলচ্চিত্রায়িত
      প্রেমকাহিনিগুলোর একটি।
    description_en: >-
      Devdas, son of a zamindar in the village of Talsonapur, and Parvati, the girl
      next door, grow up inseparable. Family pride and his own hesitation cost him
      her love, and the grief carries him to Calcutta, to Chandramukhi, and slowly
      toward ruin. One of the most read and most filmed love stories in Bengali.

  - slug: gora
    title_bn: গোরা
    title_en: Gora
    title_latn: gora
    author: rabindranath-tagore
    form: novel
    genres: [upanyas]
    collections: [classics, rabindranath]
    first_published: 1910
    featured_rank: 3
    # the Visva-Bharati printing's appendix may contain editorial matter
    source: { root: "গোরা (রবীন্দ্রনাথ ঠাকুর)", exclude: [পরিশিষ্ট] }
    description_bn: >-
      উনিশ শতকের শেষের কলকাতা। গোঁড়া হিন্দু জাতীয়তাবাদী তরুণ গোরা, তার বন্ধু
      বিনয়, আর ব্রাহ্ম পরেশবাবুর পরিবারের সুচরিতা ও ললিতা। ধর্ম, জাত আর দেশ নিয়ে
      তর্ক-বিতর্কে এগোনো এই উপন্যাসের শেষে গোরা নিজের জন্ম নিয়ে এমন এক সত্যের
      মুখোমুখি হয়, যা তার সব বিশ্বাসকে নতুন করে ভাবায়। রবীন্দ্রনাথের দীর্ঘতম
      উপন্যাস।
    description_en: >-
      Calcutta at the end of the nineteenth century. Gora, a fiercely orthodox young
      Hindu nationalist; his friend Binoy; and Sucharita and Lolita of the Brahmo
      household of Paresh Babu. Through arguments over religion, caste and nation the
      novel moves toward a truth about Gora's birth that unsettles everything he
      believes. Tagore's longest novel.

  - slug: srikanta-1
    title_bn: শ্রীকান্ত
    subtitle_bn: প্রথম পর্ব
    title_en: Srikanta (Part One)
    title_latn: srikanta srikanto shrikanta srikanta part 1 prothom porbo
    author: sarat-chandra-chattopadhyay
    form: novel
    genres: [upanyas]
    collections: [saratchandra]
    first_published: 1917
    source: { root: "শ্রীকান্ত (প্রথম পর্ব)" }
    description_bn: >-
      ভবঘুরে শ্রীকান্তের নিজের মুখে বলা জীবনের গল্প। দুঃসাহসী বন্ধু ইন্দ্রনাথের
      সঙ্গে রাতের নদীতে নৌকাযাত্রা থেকে শুরু করে পিয়ারী বাইজির মধ্যে ছেলেবেলার
      চেনা রাজলক্ষ্মীকে খুঁজে পাওয়া পর্যন্ত — চার পর্বের এই উপন্যাসের প্রথম পর্ব।
    description_en: >-
      Srikanta, a born wanderer, tells his own story: from night-time boat trips on
      the river with his fearless friend Indranath to finding, in the singer Piyari,
      the Rajlakshmi he knew as a child. The first of the novel's four parts.

  - slug: palli-samaj
    title_bn: পল্লী-সমাজ
    title_en: Palli Samaj
    title_latn: palli samaj polli somaj pallisamaj
    author: sarat-chandra-chattopadhyay
    form: novel
    genres: [upanyas]
    collections: [saratchandra]
    first_published: 1916
    source: { root: "পল্লী-সমাজ (শরৎচন্দ্র চট্টোপাধ্যায়, ১৯১৯)" }
    description_bn: >-
      বাবার শ্রাদ্ধ করতে গ্রামে ফিরে তরুণ রমেশ দেখে দলাদলি, কুসংস্কার আর স্বার্থে
      জর্জর এক পল্লীসমাজ। গ্রামের ভালো করতে চাওয়া রমেশ আর তার ছেলেবেলার সঙ্গিনী,
      বিধবা রমার না-বলা ভালোবাসাকে ঘিরে গ্রামবাংলার সমাজের নির্মোহ ছবি।
    description_en: >-
      Returning to his village for his father's funeral rites, young Ramesh finds a
      community torn by feuds, superstition and self-interest. His efforts for the
      village and his unspoken love for Rama, his childhood companion and now a
      widow, make an unsentimental portrait of rural Bengal.

  - slug: bardidi
    title_bn: বড়দিদি
    title_en: Bardidi
    title_latn: bardidi boro didi borodidi
    author: sarat-chandra-chattopadhyay
    form: novel
    genres: [upanyas]
    collections: [saratchandra]
    first_published: 1913
    source: { root: "বড়দিদি (শরৎচন্দ্র চট্টোপাধ্যায়)" }
    description_bn: >-
      বাড়ির চেনা আশ্রয় ছেড়ে কলকাতায় আসা সরল যুবক সুরেন্দ্রনাথ গৃহশিক্ষক হয়ে ঢোকে
      এমন এক বাড়িতে, যার সংসার চালান বিধবা মাধবী — সবার ‘বড়দিদি’। না-বলা
      ভালোবাসা আর আত্মসংযমের এই ছোট উপন্যাসই শরৎচন্দ্রকে প্রথম পাঠকপ্রিয়তা এনে
      দিয়েছিল।
    description_en: >-
      Surendranath, a guileless young man who leaves home for Calcutta, becomes a
      tutor in a household run by the widowed Madhavi — "Bardidi", the elder sister
      of the house. A short novel of unspoken love and restraint, and the book that
      first won Sarat Chandra his readers.

  - slug: chaturanga
    title_bn: চতুরঙ্গ
    title_en: Chaturanga
    title_latn: chaturanga chaturango choturongo
    author: rabindranath-tagore
    form: novel
    genres: [upanyas]
    collections: [rabindranath]
    first_published: 1916
    source: { root: "চতুরঙ্গ (রবীন্দ্রনাথ ঠাকুর)" }
    description_bn: >-
      জ্যাঠামশাই, শচীশ, দামিনী ও শ্রীবিলাস — চার অধ্যায়ে বলা এক গল্প। নাস্তিক
      জ্যাঠামশাইয়ের আদর্শে মানুষ শচীশ পরে খোঁজে ভক্তি আর সাধনার পথ; তার পাশে
      দাঁড়ায় জীবনকে পুরোপুরি চাওয়া বিধবা দামিনী। বন্ধু শ্রীবিলাসের চোখে দেখা এক
      অস্থির আত্মানুসন্ধান।
    description_en: >-
      Told in four parts — Jyathamashai, Sachish, Damini and Sribilas. Raised on his
      atheist uncle's ideals, Sachish turns to devotion and the ascetic path, while
      the widow Damini wants life in full. A restless search for meaning, seen
      through the eyes of his friend Sribilas.

  - slug: kapalkundala
    title_bn: কপালকুণ্ডলা
    title_en: Kapalkundala
    title_latn: kapalkundala kopalkundola kapal kundala
    author: bankim-chandra-chattopadhyay
    form: novel
    genres: [upanyas]
    collections: [classics, bankimchandra]
    first_published: 1866
    source: { root: "কপালকুণ্ডলা (বঙ্কিমচন্দ্র চট্টোপাধ্যায়, ১৮৭০)" }
    description_bn: >-
      সাগরদ্বীপে তীর্থযাত্রা সেরে ফেরার পথে সঙ্গীরা নির্জন সমুদ্রতীরে ফেলে যায়
      নবকুমারকে। এক কাপালিকের আশ্রমে বড় হওয়া বনবাসিনী কপালকুণ্ডলা তার প্রাণ
      বাঁচায়। সমাজ-সংসারের বাইরে বেড়ে ওঠা এক নারীর রহস্যময়, বিষণ্ণ কাহিনি;
      বঙ্কিমচন্দ্রের দ্বিতীয় উপন্যাস।
    description_en: >-
      Returning from a pilgrimage to Sagar Island, Nabakumar is abandoned by his
      companions on a lonely shore. Kapalkundala, raised in the wild by a tantric
      Kapalik, saves his life. A mysterious, melancholy tale of a woman who grew up
      outside society — Bankim's second novel.

  - slug: anandamath
    title_bn: আনন্দমঠ
    title_en: Anandamath
    title_latn: anandamath anondomoth ananda math anandamatha
    author: bankim-chandra-chattopadhyay
    form: novel
    genres: [upanyas]
    collections: [classics, bankimchandra]
    first_published: 1882
    source: { root: "আনন্দমঠ (১৮৮৩)" }
    description_bn: >-
      ছিয়াত্তরের মন্বন্তরের (১৭৭০) পটভূমিতে সন্ন্যাসী-বিদ্রোহের কাহিনি।
      দুর্ভিক্ষে ঘরছাড়া মহেন্দ্র ও কল্যাণী, আর দেশমাতৃকার সেবায় ব্রতী ‘সন্তান’
      দল। এই উপন্যাসের গান ‘বন্দে মাতরম্’ পরে ভারতের জাতীয় গীত হয়।
    description_en: >-
      Set during the great Bengal famine of 1770 and the Sannyasi rebellion.
      Mahendra and Kalyani are driven from home by famine, and the "Santans", an
      order of ascetic rebels, are sworn to serve the motherland. The novel's song
      "Bande Mataram" later became India's national song.

