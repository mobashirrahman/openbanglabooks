      আত্মনিবেদনের এই কবিতাগুলোর কয়েকটির ইংরেজি অনুবাদ ‘Song Offerings’-এর জন্য
      রবীন্দ্রনাথ ১৯১৩ সালে নোবেল পুরস্কার পান।
    description_en: >-
      A collection of 157 songs and poems of devotion and surrender — to the divine,
      to nature, to people. Tagore's own English renderings of some of them, Song
      Offerings, won him the Nobel Prize in 1913.

