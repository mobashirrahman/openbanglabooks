    author: rabindranath-tagore
    form: short-stories
    genres: [chhotogolpo]
    collections: [classics, rabindranath]
    first_published: 1900
    source: { root: "গল্পগুচ্ছ (প্রথম খণ্ড)" }
    description_bn: >-
      রবীন্দ্রনাথের ছোটগল্পের প্রথম খণ্ড — ‘পোস্ট্‌মাস্টার’, ‘কাবুলিওয়ালা’,
      ‘ছুটি’, ‘সুভা’, ‘দেনাপাওনা’ ও ‘খাতা’ সহ তেত্রিশটি গল্প। গ্রামবাংলার সাধারণ
      মানুষের জীবন নিয়ে লেখা এই গল্পগুলো দিয়েই আধুনিক বাংলা ছোটগল্পের শুরু।
    description_en: >-
      The first volume of Tagore's short stories — thirty-three tales including "The
      Postmaster", "Kabuliwala", "Chhuti", "Subha", "Denapaona" and "Khata". Stories
      of ordinary lives in rural Bengal with which the modern Bengali short story
      begins.

