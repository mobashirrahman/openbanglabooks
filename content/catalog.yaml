      রবীন্দ্রনাথের কাব্যগ্রন্থ। নাম-কবিতা ‘সোনার তরী’ থেকে ‘যেতে নাহি দিব’,
      ‘মানস-সুন্দরী’, ‘বসুন্ধরা’ ও ‘নিরুদ্দেশ যাত্রা’ — পদ্মাপারের শিলাইদহে
      জমিদারি দেখাশোনার দিনগুলোতে লেখা কবিতা।
    description_en: >-
      Tagore's collection of poems, from the title poem "Sonar Tori" (The Golden
      Boat) to "Jete Nahi Dibo", "Manas-Sundari", "Basundhara" and "Niruddesh Jatra"
      — written in the years he spent managing the family estates on the Padma at
      Shilaidaha.

