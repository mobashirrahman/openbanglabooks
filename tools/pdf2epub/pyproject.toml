[project]
name = "pdf2epub"
version = "0.1.0"
description = "PDF → structured book bundle for OpenBanglaBooks' EPUB builder"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "pillow>=10",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Surya OCR 2 (the measured Bengali baseline). Install only when you need OCR:
#   pip install -e 'tools/pdf2epub[surya]'
# It also needs vLLM (NVIDIA) or llama.cpp (CPU / Apple Silicon); see docs/pdf-to-epub.md.
# Measured with surya-ocr 0.22.1 + Surya 2. Keep the 2.x series; 0.23 is the
# 2.5-era client and has not been through this pipeline's tests.
surya = ["surya-ocr>=0.20,<0.23"]
pdfcraft = ["pdf-craft @ git+https://github.com/mobashirrahman/pdf-craft.git"]
dev = ["pytest>=8"]

[project.scripts]
pdf2epub = "pdf2epub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf2epub"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
